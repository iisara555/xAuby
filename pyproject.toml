[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "xauby"
version = "0.1.0"
description = "xAuby Trading Bot"
requires-python = ">=3.10"

[project.scripts]
xauby = "xauby.cli:main"
xauby-saas = "xauby.saas.__main__:main"
xauby-admin = "xauby.saas.admin:main"

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "pytest-asyncio>=0.26.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["xauby*"]

[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = [
  "docs/book",
  "Website",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = [
  "E501",
]

[tool.ruff.lint.per-file-ignores]
"xauby/saas/app.py" = ["B008"]
