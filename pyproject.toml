[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "xauby"
version = "0.1.0"
description = "xAuby Trading Bot"
requires-python = ">=3.10"

[project.scripts]
xauby = "xauby.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["xauby*"]
