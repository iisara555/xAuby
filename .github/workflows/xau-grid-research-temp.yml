name: Temporary XAU OKX PF Grid

on:
  push:
    branches:
      - codex/xau-okx-pf-grid-20260728

permissions:
  contents: read

jobs:
  grid:
    if: contains(github.event.head_commit.message, '[run-xau-grid]')
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install Python dependencies
        run: pip install -r requirements.txt
      - name: Run OKX XAU PF grid
        run: >-
          PYTHONPATH=. python3 scripts/xau_okx_pf_grid.py
          --out-dir artifacts/xau-okx-pf-grid
          --workers 4
          --top-n 12
      - uses: actions/upload-artifact@v4
        with:
          name: xau-okx-pf-grid
          path: artifacts/xau-okx-pf-grid/
          retention-days: 7
