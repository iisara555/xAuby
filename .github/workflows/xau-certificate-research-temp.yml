name: Temporary XAU Preset Certificate

on:
  push:
    branches:
      - codex/xau-okx-pf-grid-20260728

permissions:
  contents: read

jobs:
  certificate:
    if: contains(github.event.head_commit.message, '[run-xau-cert]')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install Python dependencies
        run: pip install -r requirements.txt
      - name: Issue certificate from the exact preset profile
        run: >-
          PYTHONPATH=. python3 scripts/certify_preset.py
          --preset okx-xau-actionzone-v1
          --config bot_config.yaml
          --data-symbol XAUT-USDT
          --document docs/research/xau_long_only_d1_certificate_2026-07-29.md
          --trials 432
          --note "Certifies the exact long-only + D1 execution_profile under the pre-registered long-only gate: net positive on OKX XAUT-USDT 4h. This profile was selected from a 432-cell grid using the same four-year period; the native XAU swap check covers only 1.3 years and 25 trades, and no pristine holdout or six-month shadow record exists. Treat the PF as evidence with material selection and sample uncertainty, not an all-weather guarantee. See docs/research/xau_long_only_d1_certificate_2026-07-29.md."
      - uses: actions/upload-artifact@v4
        with:
          name: xau-long-only-d1-certificate
          path: xauby/saas/certificates/okx-xau-actionzone-v1.json
          retention-days: 7
