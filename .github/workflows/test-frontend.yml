name: Test (Frontend)

# See test-python.yml for why the split is by file rather than by job.

on:
  pull_request:
    paths:
      - 'Website/**'
      - scripts/check_image_optimizer_policy.py
      - .github/workflows/test-frontend.yml
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test-frontend:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: Website/package-lock.json
      - name: Enforce image optimizer security policy
        run: python3 scripts/check_image_optimizer_policy.py Website
      - name: Install frontend dependencies
        working-directory: Website
        run: npm ci
      - name: Build frontend
        working-directory: Website
        run: npm run build
