name: XAU CDC trailing-stop A/B research

on:
  workflow_dispatch:
    inputs:
      workers:
        description: Worker processes on the GitHub-hosted runner
        required: true
        default: "4"
        type: choice
        options:
          - "2"
          - "4"
          - "6"
          - "8"
      top_n:
        description: OOS-ranked finalists to replay on full history
        required: true
        default: "12"
        type: choice
        options:
          - "5"
          - "12"
          - "20"

permissions:
  contents: read

# This branch-only workflow reuses a dispatcher that exists on main so the
# research can run on a GitHub-hosted runner without loading the trading VPS.
concurrency:
  group: xauby-github-hosted-backtest
  cancel-in-progress: false

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python dependencies
        run: pip install -r requirements.txt
      - name: Run XAU CDC trailing-stop A/B
        run: >-
          python scripts/xau_cdc_trailing_ab.py
          --out-dir core/xau_cdc_trailing_ab
      - name: Record reproducibility metadata
        if: always()
        shell: bash
        run: |
          mkdir -p core/xau_cdc_trailing_ab
          git rev-parse HEAD > core/xau_cdc_trailing_ab/git_commit.txt
          date -u +"%Y-%m-%dT%H:%M:%SZ" > core/xau_cdc_trailing_ab/completed_at_utc.txt
          printf '%s\n' "$RUNNER_NAME" > core/xau_cdc_trailing_ab/runner_name.txt
      - name: Upload A/B report artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xau-cdc-trailing-ab-${{ github.run_id }}
          path: core/xau_cdc_trailing_ab/
          if-no-files-found: error
          retention-days: 90
