name: Dependency Audit

# Roadmap P2.3. AGENTS.md lets an agent merge its own PR once CI is green, and
# `main` is what the live trading engine pulls — so CI is the only gate between
# an agent's commit and real money. It had no dependency scanning at all.
#
# The schedule matters as much as the pull_request trigger: a CVE disclosed
# against a dependency we already ship does not arrive with a push, so a
# push-only audit would never see it.

# Gated on the dependency manifests rather than running per PR. pip-audit
# resolves the entire requirements set and is by far the slowest job here: on
# PR #51 — a change touching no dependency file at all — it was killed at the
# 30-minute ceiling mid-resolution, having reported nothing. Auditing an
# unchanged dependency set re-derives main's own verdict, so the trigger now
# follows the manifests. The schedule below is what actually catches newly
# disclosed advisories, and it is unchanged.
on:
  pull_request:
    paths:
      - requirements.txt
      - requirements-dev.txt
      - Website/package.json
      - Website/package-lock.json
      - .github/workflows/security.yml
  push:
    branches:
      - main
    paths:
      - requirements.txt
      - requirements-dev.txt
      - Website/package.json
      - Website/package-lock.json
      - .github/workflows/security.yml
  schedule:
    # Mondays 06:00 UTC. Weekly is enough for a two-tenant deployment and keeps
    # the noise low enough that someone still reads the failures.
    - cron: "0 6 * * 1"
  workflow_dispatch:

# A scheduled audit must never be cancelled by a PR run, hence the event-scoped
# group; only PR runs supersede one another.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  python-dependencies:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    # This job used to hit its ceiling on every run — three times in a row on
    # 2026-08-01, each time reporting nothing. The explanation here used to
    # blame pandas-ta resolution; that was wrong on two counts. The stack trace
    # at cancellation pointed at pip-audit writing its advisory HTTP cache
    # (pip_audit/_cache.py -> NamedTemporaryFile) on the old Windows runner,
    # and pip-audit skips pandas-ta outright ("Dependency not found on PyPI"),
    # so it was never the thing being resolved.
    #
    # On ubuntu-latest the same command takes 22 seconds locally and completed
    # in 23 in CI, so this ceiling is headroom against a hung network call
    # rather than something a normal run approaches.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          # Reuse the shared Actions cache so each fresh runner does not need to
          # re-download numpy, pandas and scipy.
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install pip-audit
        run: pip install pip-audit
      # Blocking, with one named exception rather than a blanket
      # continue-on-error. A new advisory against anything we ship fails this
      # job; the one finding we cannot act on is listed here with its reason, so
      # it is documented rather than hidden.
      #
      # PYSEC-2026-3447 (setuptools <= 80, fixed in 83.0.0) cannot be resolved
      # today: pandas-ta declares `setuptools (<=80)`, so its own cap pins the
      # vulnerable version in place. Removing the ignore requires either a
      # pandas-ta release that lifts the cap, patching the fork we install from
      # (requirements.txt points at MerlinR/Pandas-ta-fork), or replacing the
      # library. Revisit when any of those happens.
      - name: pip-audit
        run: pip-audit -r requirements.txt --ignore-vuln PYSEC-2026-3447 --progress-spinner off

  node-dependencies:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: Website/package-lock.json
      - name: Install frontend dependencies
        working-directory: Website
        run: npm ci
      # Blocks on critical. Two `high` findings are outstanding and cannot be
      # fixed forward: sharp < 0.35.0 inherits four libvips CVEs, and the only
      # remediation npm offers is next@14.2.35 — a semver-major *downgrade* from
      # the 16.2.x line this site is built and deployed on. The vulnerable range
      # covers every 16.x release, so there is no patch to take.
      #
      # Partial mitigation, not a clean bill of health: the single next/image
      # usage (components/profile-avatar.tsx) passes `unoptimized`, so it does
      # not route images through the optimizer that reaches libvips. That has
      # not been verified for every route.
      #
      # Raise this back to `high` the moment Next ships a release with a fixed
      # sharp.
      - name: npm audit
        working-directory: Website
        run: npm audit --omit=dev --audit-level=critical
      - name: npm audit (full report, including the known high findings)
        working-directory: Website
        continue-on-error: true
        run: npm audit --omit=dev

  sbom:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # GitHub recommends Anchore/Syft as an SBOM generator. Pin the immutable
      # commit behind v0.24.0: this job inventories the supply chain, so a
      # floating third-party action would undermine the control it provides.
      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: .
          format: spdx-json
          output-file: xauby-${{ github.sha }}.spdx.json
          artifact-name: xauby-sbom-${{ github.sha }}
          upload-artifact-retention: 30
          upload-release-assets: false
