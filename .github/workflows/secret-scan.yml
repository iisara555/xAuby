name: Secret Scan

# Both jobs here are cheap (~20s and ~2min) and apply to any change, so this
# workflow deliberately has no path filter — it runs on every PR. The heavier
# per-language suites live in test-python.yml / test-frontend.yml so they can
# be skipped when their language is untouched.

on:
  pull_request:
  push:
    branches:
      - main

# One self-hosted runner serves this repo, so queued runs are strictly
# serialised: superseded PR runs used to sit in the queue ahead of current
# work, and 18 of them accumulated on 2026-08-01 before being cleared by hand.
# A new push to a PR now cancels its own in-flight run. Runs on main are never
# cancelled — those validate the commit the trading engine pulls.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, windows, x64, xauby-ci]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff
        run: pip install ruff==0.16.0
      # Blocking gate. Deliberately narrower than pyproject's `select`: these are
      # the rules that catch defects rather than style. The full set reports
      # ~3,800 findings, almost all import ordering and PEP-585 annotations, and
      # a gate nobody can turn green is a gate nobody keeps.
      #
      # It earned its place immediately: F811 found two silently-discarded
      # redefinitions, one of them a 61-line dead copy of draw_hermes_banner in
      # xauby/ui/menu.py that the following definition had been shadowing.
      #
      # Widen this list as categories are cleared. Do not widen it by removing
      # rules from pyproject.
      # One line on purpose. Wrapping the selector list across backslash
      # continuations spliced the leading indentation of the next line into the
      # comma-separated value, and ruff rejected the resulting empty selector —
      # a failure my local single-line test could not reproduce.
      - name: Lint (defect rules, blocking)
        run: ruff check . --select E9,F811,F821,F822,F823,F632,F702,F706,F707,F502,F601,B006,B008,B012,B017,B018,B023,B026,B904 --output-format=github
      # The rest, visible but not blocking, so the debt has a number instead of
      # being invisible.
      - name: Lint (full configured set, report only)
        continue-on-error: true
        run: ruff check . --statistics

  secret-scan:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, windows, x64, xauby-ci]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Scan tracked files and history
        run: python scripts/scan_secrets.py --tracked --history
