name: Secret Scan

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff
        run: pip install ruff==0.16.0
      # Blocking gate. Deliberately narrower than pyproject's `select`: these are
      # the rules that catch defects rather than style. The full set reports
      # ~3,800 findings, almost all import ordering and PEP-585 annotations, and
      # a gate nobody can turn green is a gate nobody keeps.
      #
      # It earned its place immediately: F811 found two silently-discarded
      # redefinitions, one of them a 61-line dead copy of draw_hermes_banner in
      # xauby/ui/menu.py that the following definition had been shadowing.
      #
      # Widen this list as categories are cleared. Do not widen it by removing
      # rules from pyproject.
      - name: Lint (defect rules, blocking)
        run: |
          ruff check . --select \
            E9,F811,F821,F822,F823,F632,F702,F706,F707,F502,F601,\
            B006,B008,B012,B017,B018,B023,B026,B904 \
            --output-format=github
      # The rest, visible but not blocking, so the debt has a number instead of
      # being invisible.
      - name: Lint (full configured set, report only)
        continue-on-error: true
        run: ruff check . --statistics

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Scan tracked files and history
        run: python scripts/scan_secrets.py --tracked --history

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install Python dependencies
        run: pip install -r requirements-dev.txt
      - name: Run Python test suite
        run: pytest -q
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: Website/package-lock.json
      - name: Install frontend dependencies
        working-directory: Website
        run: npm ci
      - name: Build frontend
        working-directory: Website
        run: npm run build
