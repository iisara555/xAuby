  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    const resourceBlobs = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

ia-hidden=\"true\" style=\"font-size: clamp(18px, 2.2vw, 24px); font-weight: 500; font-variant-numeric: tabular-nums; color: {{ step.numColor }};\">{{ step.num }}<\u002Fspan>\n            <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 4px clamp(16px, 3vw, 40px); align-items: baseline;\">\n              <h3 style=\"margin: 0; font-size: clamp(16px, 1.7vw, 20px); font-weight: 600;\">{{ step.title }}<\u002Fh3>\n              <p style=\"margin: 0; font-size: 14px; line-height: 1.55; color: rgba(236,233,226,.62); max-width: 56ch;\">{{ step.body }}<\u002Fp>\n            <\u002Fdiv>\n          <\u002Fli>\n        <\u002Fsc-for>\n      <\u002Fol>\n    <\u002Fsection>\n\n    <!-- ===== Architecture ===== -->\n    <section id=\"architecture\" aria-labelledby=\"architecture-heading\" style=\"padding: 0 0 clamp(56px, 8vw, 100px); scroll-margin-top: 76px;\">\n      <div style=\"display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: clamp(20px, 3vw, 32px);\">\n        <h2 id=\"architecture-heading\" style=\"margin: 0; font-size: clamp(26px, 3.4vw, 42px); font-weight: 600; letter-spacing: -0.02em; text-wrap: balance;\">One market today. Built for many<span style=\"color: #ff431a;\">.<\u002Fspan><\u002Fh2>\n        <p style=\"margin: 0; font-size: 11px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: rgba(236,233,226,.5);\">Strategy plugins · multi-pair · multi-exchange<\u002Fp>\n      <\u002Fdiv>\n      <p style=\"margin: 0 0 clamp(20px, 3vw, 32px); max-width: 66ch; font-size: 14px; line-height: 1.6; color: rgba(236,233,226,.62);\">Under the single gold desk is a general trading platform: strategies are plugins, pairs are configuration, exchanges are adapters. Running one market on one exchange is a risk decision, not a technical ceiling — expanding is an edit to a config file, not a rewrite.<\u002Fp>\n      <ul style=\"list-style: none; margin: 0; padding: 0; display: grid;\">\n        <sc-for list=\"{{ archPillars }}\" as=\"p\" hint-placeholder-count=\"3\">\n          <li style=\"display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px clamp(16px, 3vw, 40px); align-items: start; padding: clamp(18px, 2.6vw, 26px) 0; border-top: 1px solid rgba(236,233,226,.18);\">\n            <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 4px clamp(16px, 3vw, 40px);\">\n              <h3 style=\"margin: 0; font-size: clamp(16px, 1.7vw, 20px); font-weight: 600;\">{{ p.title }}<\u002Fh3>\n              <p style=\"margin: 0; font-size: 14px; line-height: 1.55; color: rgba(236,233,226,.62); max-width: 58ch;\">{{ p.body }}<\u002Fp>\n            <\u002Fdiv>\n            <span style=\"justify-self: start; white-space: nowrap; padding: 6px 12px; font-size: 10px; font-weight: 600; letter-spacing: .08em; color: {{ p.tagInk }}; background: {{ p.tagBg }}; border: 1px solid {{ p.tagBorder }};\">{{ p.tag }}<\u002Fspan>\n          <\u002Fli>\n        <\u002Fsc-for>\n      <\u002Ful>\n      <div style=\"display: flex; flex-wrap: wrap; align-items: center; gap: 12px; margin-top: clamp(22px, 3vw, 32px);\">\n        <a href=\"https://github.com/iisara555/xAuby\" style=\"display: inline-flex; align-items: center; gap: 8px; min-height: 48px; padding: 0 26px; border: 1px solid rgba(236,233,226,.35); color: #ece9e2; font-size: 14px; font-weight: 600;\" style-hover=\"border-color: #ff6a3c; color: #ff6a3c;\">View source on GitHub <span aria-hidden=\"true\">→<\u002Fspan><\u002Fa>\n        <span style=\"font-size: 12px; color: rgba(236,233,226,.5);\">iisara555/xAuby · read the code that runs live<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <!-- ===== Risk ===== -->\n    <section id=\"risk\" aria-labelledby=\"risk-heading\" style=\"padding: 0 0 clamp(48px, 7vw, 90px); scroll-margin-top: 76px;\">\n      <div style=\"border: 1px solid rgba(236,233,226,.25); background: #1e1e1b; padding: clamp(26px, 4vw, 48px);\">\n        <div style=\"display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 12px;\">\n          <h2 id=\"risk-heading\" style=\"margin: 0; font-size: clamp(24px, 3.2vw, 38px); font-weight: 600; letter-spacing: -0.02em;\">Risk limits, hard-coded<span style=\"color: #ff431a;\">.<\u002Fspan><\u002Fh2>\n          <span style=\"padding: 7px 12px; font-size: 10px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: #ece9e2; border: 1px solid rgba(236,233,226,.3);\">Enforced by the engine<\u002Fspan>\n        <\u002Fdiv>\n        <p style=\"margin: 14px 0 0; max-width: 60ch; font-size: 14px; line-height: 1.55; color: rgba(236,233,226,.62);\">Most trading systems fail on discipline, not on signals. Here every entry passes the same gates — position sizing, capital allocation, a daily loss cap, and a portfolio kill-switch on drawdown. There is no override button, on purpose: the operator cannot panic-trade his own system.<\u002Fp>\n        <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 0; margin-top: clamp(22px, 3.2vw, 36px); border-top: 1px solid rgba(236,233,226,.2);\">\n          <sc-for list=\"{{ riskStats }}\" as=\"risk\" hint-placeholder-count=\"6\">\n            <div style=\"padding: clamp(14px, 2.2vw, 22px) clamp(8px, 1.2vw, 14px) clamp(12px, 1.8vw, 18px) 0; border-bottom: 1px solid rgba(236,233,226,.12);\">\n              <div style=\"font-size: clamp(24px, 2.8vw, 34px); font-weight: 600; line-height: 1; font-variant-numeric: tabular-nums; letter-spacing: -0.01em;\">{{ risk.value }}<\u002Fdiv>\n              <div style=\"margin-top: 7px; font-size: 10.5px; font-weight: 500; letter-spacing: .08em; text-transform: uppercase; color: rgba(236,233,226,.55);\">{{ risk.label }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n\n        <!-- Gate arithmetic instrument -->\n        <div style=\"margin-top: clamp(20px, 3vw, 30px); border-top: 1px solid rgba(236,233,226,.2); padding-top: clamp(18px, 2.5vw, 26px);\">\n          <div style=\"display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px 16px;\">\n            <h3 style=\"margin: 0; font-size: clamp(15px, 1.6vw, 18px); font-weight: 600;\">The gate arithmetic, at your equity<\u002Fh3>\n            <span style=\"font-size: 12px; font-weight: 600; letter-spacing: .06em; color: rgba(236,233,226,.55);\">Equity <strong style=\"font-variant-numeric: tabular-nums; color: #ece9e2;\">{{ equityText }} USDT<\u002Fstrong><\u002Fspan>\n          <\u002Fdiv>\n          <input type=\"range\" class=\"xn-dial\" min=\"1000\" max=\"100000\" step=\"1000\" value=\"{{ equityVal }}\" sc-camel-on-input=\"{{ onEquity }}\" aria-label=\"Account equity in USDT\" aria-valuetext=\"{{ equityText }} USDT\">\n          <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); border-top: 1px solid rgba(236,233,226,.18);\">\n            <sc-for list=\"{{ gateRows }}\" as=\"g\" hint-placeholder-count=\"3\">\n              <div style=\"padding: 14px 14px 4px 0; border-bottom: 1px solid rgba(236,233,226,.12);\">\n                <div style=\"font-size: clamp(20px, 2.4vw, 28px); font-weight: 600; line-height: 1; font-variant-numeric: tabular-nums; color: {{ g.color }};\">{{ g.value }}<\u002Fdiv>\n                <div style=\"margin-top: 6px; font-size: 10.5px; font-weight: 500; letter-spacing: .08em; text-transform: uppercase; color: rgba(236,233,226,.55);\">{{ g.label }}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <p style=\"margin: 10px 0 0; font-size: 12px; line-height: 1.5; color: rgba(236,233,226,.5);\">The same arithmetic the engine runs before every entry — move the slider; the limits move with it, the percentages never do.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <!-- ===== Backtest ===== -->\n    <section id=\"backtest\" aria-labelledby=\"backtest-heading\" style=\"padding: 0 0 clamp(56px, 8vw, 100px); scroll-margin-top: 76px;\">\n      <p style=\"margin: 0 0 14px; font-size: 11px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: rgba(236,233,226,.5);\">Backtest — 6 years · PAXGUSDT proxy · 12,810 4h bars · 150+ runs<\u002Fp>\n      <h2 id=\"backtest-heading\" style=\"margin: 0; font-size: clamp(26px, 3.4vw, 42px); font-weight: 600; letter-spacing: -0.02em; text-wrap: balance;\">From −16.9% to +92.8% on the same six years<span style=\"color: #ff431a;\">.<\u002Fspan><\u002Fh2>\n      <p style=\"margin: 14px 0 0; max-width: 60ch; font-size: 14px; line-height: 1.6; color: rgba(236,233,226,.62);\">The unfiltered base strategy lost 16.9% over six years of gold history. Two disciplined changes — a trend filter and a partial take-profit — turned the same rules into +92.8%, across 150+ documented runs. The exact configuration that won the backtest is the one running live today.<\u002Fp>\n\n      <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(290px, 1fr)); gap: clamp(14px, 2vw, 22px); margin-top: clamp(22px, 3.2vw, 36px); align-items: stretch;\">\n        <div style=\"border: 1px solid #ece9e2; background: #ece9e2; color: #161614; padding: clamp(24px, 3.5vw, 40px);\">\n          <span style=\"display: block; font-size: 10.5px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: rgba(22,22,20,.6);\">Net profit, 6 years · 10,000 → 19,281 USDT<\u002Fspan>\n          <div id=\"bt-big\" style=\"font-size: clamp(48px, 6.5vw, 72px); font-weight: 600; line-height: 1; margin-top: 10px; letter-spacing: -0.02em; color: #e03a10; font-variant-numeric: tabular-nums;\">+92.81%<\u002Fdiv>\n          <div style=\"display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0; margin-top: clamp(18px, 2.8vw, 28px); border-top: 1px solid rgba(22,22,20,.25);\">\n            <sc-for list=\"{{ backtestStats }}\" as=\"bt\" hint-placeholder-count=\"4\">\n              <div style=\"padding: 14px 8px 6px 0; border-bottom: 1px solid rgba(22,22,20,.15);\">\n                <div style=\"font-size: clamp(19px, 2.2vw, 24px); font-weight: 600; font-variant-numeric: tabular-nums;\">{{ bt.value }}<\u002Fdiv>\n                <div style=\"margin-top: 5px; font-size: 10px; font-weight: 500; letter-spacing: .07em; text-transform: uppercase; color: rgba(22,22,20,.6);\">{{ bt.label }}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"border: 1px solid rgba(236,233,226,.25); background: #1e1e1b; padding: clamp(24px, 3.5vw, 40px);\">\n          <span style=\"display: block; font-size: 10.5px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: rgba(236,233,226,.55); margin-bottom: 18px;\">Annual return<\u002Fspan>\n          <div style=\"display: grid; gap: 10px;\">\n            <sc-for list=\"{{ yearlyReturns }}\" as=\"yr\" hint-placeholder-count=\"7\">\n              <div style=\"display: grid; grid-template-columns: 40px minmax(0, 1fr) 56px; align-items: center; gap: 10px;\">\n                <span style=\"font-size: 12px; font-variant-numeric: tabular-nums; color: rgba(236,233,226,.55);\">{{ yr.year }}<\u002Fspan>\n                <span style=\"position: relative; height: 14px; background: rgba(236,233,226,.07); overflow: hidden;\">\n                  <span style=\"position: absolute; top: 0; bottom: 0; left: {{ yr.barLeft }}%; width: {{ yr.barWidth }}%; background: {{ yr.barColor }};\"><\u002Fspan>\n                <\u002Fspan>\n                <strong style=\"font-size: 12.5px; font-weight: 600; font-variant-numeric: tabular-nums; text-align: right; color: {{ yr.textColor }};\">{{ yr.value }}<\u002Fstrong>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <p style=\"margin: 16px 0 0; max-width: 72ch; font-size: 12px; line-height: 1.55; color: rgba(236,233,226,.5);\">Backtest only, not a guarantee of future returns. Figures describe PAXGUSDT 4h history (Aug 2020 – Jul 2026) used as a proxy for XAU, which lacks deep history on its own; capital compounds across trades, so total return carries higher variance than win rate, profit factor, or drawdown.<\u002Fp>\n    <\u002Fsection>\n\n    <!-- ===== Research ===== -->\n    <section id=\"research\" aria-labelledby=\"research-heading\" style=\"padding: 0 0 clamp(56px, 8vw, 100px); scroll-margin-top: 76px;\">\n      <div style=\"display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: clamp(20px, 3vw, 32px);\">\n        <h2 id=\"research-heading\" style=\"margin: 0; font-size: clamp(26px, 3.4vw, 42px); font-weight: 600; letter-spacing: -0.02em; text-wrap: balance;\">The research library<span style=\"color: #ff431a;\">.<\u002Fspan><\u002Fh2>\n        <p style=\"margin: 0; font-size: 11px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: rgba(236,233,226,.5);\">In-sample / out-of-sample · walk-forward · full costs<\u002Fp>\n      <\u002Fdiv>\n      <p style=\"margin: 0 0 clamp(20px, 3vw, 32px); max-width: 66ch; font-size: 14px; line-height: 1.6; color: rgba(236,233,226,.62);\">Every study runs on the same engine that trades live — same code path, same fees, same slippage — on six years of gold history. Selection favors what survives the sideways years, not what looks best in a bull market.<\u002Fp>\n      <ol style=\"list-style: none; margin: 0; padding: 0; display: grid;\">\n        <sc-for list=\"{{ reports }}\" as=\"rep\" hint-placeholder-count=\"4\">\n          <li class=\"xn-reveal\" style=\"display: grid; grid-template-columns: clamp(48px, 7vw, 88px) minmax(0, 1fr); gap: clamp(12px, 3vw, 32px); padding: clamp(18px, 2.6vw, 28px) 0; border-top: 1px solid rgba(236,233,226,.18); opacity: 0; transform: translateY(14px); transition: opacity 560ms ease-out, transform 560ms ease-out;\" style-hover=\"background: rgba(236,233,226,.03);\">\n            <span aria-hidden=\"true\" style=\"font-size: clamp(18px, 2.2vw, 24px); font-weight: 500; font-variant-numeric: tabular-nums; color: {{ rep.numColor }};\">{{ rep.num }}<\u002Fspan>\n            <div style=\"min-width: 0;\">\n              <div style=\"display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 4px 16px;\">\n                <h3 style=\"margin: 0; font-size: clamp(16px, 1.7vw, 20px); font-weight: 600;\">{{ rep.title }}<\u002Fh3>\n                <span style=\"font-size: 11px; font-weight: 500; letter-spacing: .08em; text-transform: uppercase; color: rgba(236,233,226,.5); font-variant-numeric: tabular-nums;\">{{ rep.date }}<\u002Fspan>\n              <\u002Fdiv>\n              <p style=\"margin: 8px 0 0; font-size: 14px; line-height: 1.55; color: rgba(236,233,226,.62); max-width: 68ch;\">{{ rep.summary }}<\u002Fp>\n              <div style=\"display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px;\">\n                <sc-for list=\"{{ rep.stats }}\" as=\"st\" hint-placeholder-count=\"3\">\n                  <span style=\"display: inline-flex; align-items: baseline; gap: 6px; padding: 6px 10px; border: 1px solid rgba(236,233,226,.22); font-size: 12px; font-variant-numeric: tabular-nums;\"><strong style=\"font-weight: 600; color: {{ st.color }};\">{{ st.value }}<\u002Fstrong><span style=\"font-size: 10.5px; letter-spacing: .05em; text-transform: uppercase; color: rgba(236,233,226,.55);\">{{ st.label }}<\u002Fspan><\u002Fspan>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fli>\n        <\u002Fsc-for>\n      <\u002Fol>\n      <!-- Portfolio dial — interactive companion to R3 -->\n      <div style=\"margin-top: clamp(20px, 3vw, 32px); border: 1px solid rgba(236,233,226,.25); background: #1e1e1b; padding: clamp(22px, 3.2vw, 36px);\">\n        <div style=\"display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px 16px;\">\n          <h3 style=\"margin: 0; font-size: clamp(16px, 1.7vw, 20px); font-weight: 600;\">Try the frontier yourself<\u002Fh3>\n          <span style=\"font-size: 11px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: rgba(236,233,226,.5);\">From report R3 · 5.8y of data<\u002Fspan>\n        <\u002Fdiv>\n        <p style=\"margin: 8px 0 0; max-width: 62ch; font-size: 13.5px; line-height: 1.55; color: rgba(236,233,226,.62);\">Slide the split between the gold system and the BTC sleeve. Every readout is a measured point from the study — not a projection.<\u002Fp>\n        <div style=\"margin-top: clamp(18px, 2.5vw, 26px);\">\n          <div style=\"display: flex; justify-content: space-between; align-items: baseline; gap: 12px; font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: rgba(236,233,226,.55);\">\n            <span>Gold <strong style=\"font-variant-numeric: tabular-nums; color: #ece9e2;\">{{ xauPctText }}<\u002Fstrong><\u002Fspan>\n            <span style=\"color: {{ zoneColor }}; letter-spacing: .1em;\">{{ zoneLabel }}<\u002Fspan>\n            <span>BTC <strong style=\"font-variant-numeric: tabular-nums; color: #ece9e2;\">{{ btcPctText }}<\u002Fstrong><\u002Fspan>\n          <\u002Fdiv>\n          <input type=\"range\" class=\"xn-dial\" min=\"0\" max=\"100\" step=\"5\" value=\"{{ btcPct }}\" sc-camel-on-input=\"{{ onBtc }}\" aria-label=\"BTC allocation percentage\" aria-valuetext=\"{{ dialValueText }}\">\n        <\u002Fdiv>\n        <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); margin-top: clamp(14px, 2vw, 20px); border-top: 1px solid rgba(236,233,226,.18);\">\n          <div style=\"padding: 16px 14px 4px 0; border-bottom: 1px solid rgba(236,233,226,.12);\">\n            <div style=\"font-size: clamp(24px, 2.8vw, 34px); font-weight: 600; line-height: 1; font-variant-numeric: tabular-nums; color: #ff6a3c;\">{{ dialCagr }}<\u002Fdiv>\n            <div style=\"margin-top: 7px; font-size: 10.5px; font-weight: 500; letter-spacing: .08em; text-transform: uppercase; color: rgba(236,233,226,.55);\">CAGR<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"padding: 16px 14px 4px clamp(10px, 1.5vw, 18px); border-bottom: 1px solid rgba(236,233,226,.12); border-left: 1px solid rgba(236,233,226,.14);\">\n            <div style=\"font-size: clamp(24px, 2.8vw, 34px); font-weight: 600; line-height: 1; font-variant-numeric: tabular-nums;\">{{ dialDd }}<\u002Fdiv>\n            <div style=\"margin-top: 7px; font-size: 10.5px; font-weight: 500; letter-spacing: .08em; text-transform: uppercase; color: rgba(236,233,226,.55);\">Max drawdown<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"padding: 16px 14px 4px clamp(10px, 1.5vw, 18px); border-bottom: 1px solid rgba(236,233,226,.12); border-left: 1px solid rgba(236,233,226,.14);\">\n            <div style=\"font-size: clamp(24px, 2.8vw, 34px); font-weight: 600; line-height: 1; font-variant-numeric: tabular-nums;\">{{ dialSharpe }}<\u002Fdiv>\n            <div style=\"margin-top: 7px; font-size: 10.5px; font-weight: 500; letter-spacing: .08em; text-transform: uppercase; color: rgba(236,233,226,.55);\">Sharpe<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <p style=\"margin: 12px 0 0; font-size: 12px; line-height: 1.5; color: rgba(236,233,226,.5);\">{{ zoneNote }}<\u002Fp>\n      <\u002Fdiv>\n\n      <p style=\"margin: 18px 0 0; max-width: 72ch; font-size: 12px; line-height: 1.55; color: rgba(236,233,226,.5);\">All studies use PAXGUSDT 4h history (Aug 2020 – Jul 2026) as a point-in-time proxy for XAU, with production fees, slippage, and funding applied. Research findings are candidates, not deployments — a recommended config reaches live only after forward simulation confirms it.<\u002Fp>\n    <\u002Fsection>\n\n    <!-- ===== Regime pair ===== -->\n    <sc-if value=\"{{ showRegimeMapVal }}\" hint-placeholder-val=\"{{ true }}\">\n    <section id=\"regime\" aria-labelledby=\"regime-heading\" style=\"padding: 0 0 clamp(56px, 8vw, 100px); scroll-margin-top: 76px;\">\n      <div style=\"display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: clamp(20px, 3vw, 32px);\">\n        <h2 id=\"regime-heading\" style=\"margin: 0; font-size: clamp(26px, 3.4vw, 42px); font-weight: 600; letter-spacing: -0.02em;\">It knows when not to trade<span style=\"color: #ff431a;\">.<\u002Fspan><\u002Fh2>\n        <p style=\"margin: 0; font-size: 11px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: rgba(236,233,226,.5);\">Regime router<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"border: 1px solid rgba(236,233,226,.25); background: #1e1e1b; padding: clamp(22px, 3.2vw, 36px);\">\n        <p style=\"margin: 0 0 14px; font-size: 11px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: rgba(236,233,226,.5);\">Press a market condition · read the router's decision<\u002Fp>\n        <div role=\"group\" aria-label=\"Market regimes\" style=\"display: flex; flex-wrap: wrap; gap: 8px;\">\n          <sc-for list=\"{{ regimeKeys }}\" as=\"rk\" hint-placeholder-count=\"7\">\n            <button type=\"button\" sc-camel-on-click=\"{{ rk.select }}\" aria-pressed=\"{{ rk.pressed }}\" style=\"min-height: 44px; padding: 0 16px; font-family: 'Space Grotesk', sans-serif; font-size: 13px; font-weight: 600; cursor: pointer; border: 1px solid {{ rk.border }}; background: {{ rk.bg }}; color: {{ rk.ink }}; transition: border-color 160ms ease, background 160ms ease;\" style-hover=\"border-color: #ff6a3c;\">{{ rk.label }}<\u002Fbutton>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <div style=\"display: grid; grid-template-columns: auto minmax(0, 1fr); gap: clamp(14px, 2.5vw, 28px); align-items: start; margin-top: clamp(18px, 2.5vw, 26px); border-top: 1px solid rgba(236,233,226,.18); padding-top: clamp(16px, 2.2vw, 22px);\" aria-live=\"polite\">\n          <span aria-hidden=\"true\" style=\"width: 14px; height: 14px; border-radius: 50%; margin-top: 6px; background: {{ routerLed }}; box-shadow: 0 0 0 1px rgba(236,233,226,.25);\"><\u002Fspan>\n          <div style=\"min-width: 0;\">\n            <div style=\"display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 14px;\">\n              <strong style=\"font-size: clamp(18px, 2.2vw, 24px); font-weight: 600; font-variant-numeric: tabular-nums; color: {{ routerColor }};\">{{ routerDecision }}<\u002Fstrong>\n              <span style=\"font-family: ui-monospace, 'SF Mono', Menlo, monospace; font-size: 12px; color: rgba(236,233,226,.55);\">{{ routerStrategy }}<\u002Fspan>\n            <\u002Fdiv>\n            <p style=\"margin: 8px 0 0; max-width: 62ch; font-size: 13.5px; line-height: 1.55; color: rgba(236,233,226,.62);\">{{ routerNote }}<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n    <\u002Fsc-if>\n\n    <!-- ===== Dashboard ===== -->\n    <section id=\"dashboard\" style=\"padding: 0 0 clamp(56px, 8vw, 100px); scroll-margin-top: 76px;\">\n      <div style=\"max-width: 720px;\">\n        <p style=\"margin: 0 0 14px; font-size: 11px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: #ff6a3c;\">Read-only, by design<\u002Fp>\n        <h2 style=\"margin: 0; font-size: clamp(26px, 3.4vw, 42px); font-weight: 600; letter-spacing: -0.02em; text-wrap: balance;\">A dashboard that watches. It never touches<span style=\"color: #ff431a;\">.<\u002Fspan><\u002Fh2>\n        <p style=\"margin: 18px 0 0; max-width: 56ch; font-size: 15px; line-height: 1.6; color: rgba(236,233,226,.72);\">Monitoring is deliberately separated from control: the dashboard can see everything and change nothing — it cannot place, cancel, or modify an order, even if compromised. Five views, one question each, answerable from a phone in under ten seconds.<\u002Fp>\n        <ul style=\"list-style: none; margin: 26px 0 0; padding: 0; display: grid;\">\n          <sc-for list=\"{{ views }}\" as=\"view\" hint-placeholder-count=\"5\">\n            <li style=\"display: grid; grid-template-columns: clamp(84px, 10vw, 110px) minmax(0, 1fr); gap: 14px; align-items: baseline; padding: 11px 0; border-top: 1px solid rgba(236,233,226,.18); font-size: 14px;\">\n              <span style=\"font-weight: 600; color: {{ view.color }};\">{{ view.name }}<\u002Fspan>\n              <span style=\"color: rgba(236,233,226,.62); line-height: 1.5;\">{{ view.question }}<\u002Fspan>\n            <\u002Fli>\n          <\u002Fsc-for>\n        <\u002Ful>\n        <div style=\"display: flex; flex-wrap: wrap; align-items: center; gap: 14px; margin-top: clamp(22px, 3.2vw, 32px);\">\n          <a href=\"https://github.com/iisara555/xAuby/blob/main/docs/webui.md\" style=\"display: inline-flex; align-items: center; gap: 8px; min-height: 48px; padding: 0 28px; background: #ece9e2; color: #161614; font-size: 14px; font-weight: 600;\" style-hover=\"background: #ff431a; color: #161614;\">Read the WebUI docs <span aria-hidden=\"true\">→<\u002Fspan><\u002Fa>\n          <span style=\"font-size: 12px; color: rgba(236,233,226,.5);\">Setup, Tailscale access, and the full API it reads from<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <!-- ===== Getting started ===== -->\n    <section id=\"start\" aria-labelledby=\"start-heading\" style=\"padding: 0 0 clamp(56px, 8vw, 100px); scroll-margin-top: 76px;\">\n      <div style=\"border: 1px solid rgba(236,233,226,.25); background: #1e1e1b; padding: clamp(26px, 4vw, 48px);\">\n        <div style=\"display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: clamp(18px, 2.5vw, 28px);\">\n          <h2 id=\"start-heading\" style=\"margin: 0; font-size: clamp(24px, 3.2vw, 38px); font-weight: 600; letter-spacing: -0.02em;\">Run it yourself<span style=\"color: #ff431a;\">.<\u002Fspan><\u002Fh2>\n          <p style=\"margin: 0; font-size: 11px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: rgba(236,233,226,.5);\">Simulation first, always<\u002Fp>\n        <\u002Fdiv>\n        <ol style=\"list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 0;\">\n          <sc-for list=\"{{ startSteps }}\" as=\"s\" hint-placeholder-count=\"4\">\n            <li style=\"padding: clamp(16px, 2.4vw, 24px) clamp(14px, 2vw, 22px) clamp(16px, 2.4vw, 24px) 0; border-top: 1px solid rgba(236,233,226,.18);\">\n              <span aria-hidden=\"true\" style=\"display: block; font-size: 13px; font-weight: 500; font-variant-numeric: tabular-nums; color: #ff6a3c;\">{{ s.num }}<\u002Fspan>\n              <h3 style=\"margin: 10px 0 0; font-size: clamp(15px, 1.6vw, 18px); font-weight: 600;\">{{ s.title }}<\u002Fh3>\n              <p style=\"margin: 8px 0 0; font-size: 13.5px; line-height: 1.55; color: rgba(236,233,226,.62);\">{{ s.body }}<\u002Fp>\n            <\u002Fli>\n          <\u002Fsc-for>\n        <\u002Fol>\n        <div style=\"display: flex; flex-wrap: wrap; align-items: center; gap: 12px; margin-top: clamp(18px, 2.5vw, 26px);\">\n          <a href=\"https://github.com/iisara555/xAuby\" style=\"display: inline-flex; align-items: center; gap: 8px; min-height: 48px; padding: 0 26px; background: #ece9e2; color: #161614; font-size: 14px; font-weight: 600;\" style-hover=\"background: #ff431a; color: #161614;\">Get the code <span aria-hidden=\"true\">→<\u002Fspan><\u002Fa>\n          <span style=\"font-size: 12px; color: rgba(236,233,226,.5);\">Free and open source · your keys, your machine, your capital<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <!-- ===== Operator ===== -->\n    <sc-if value=\"{{ showOperatorVal }}\" hint-placeholder-val=\"{{ true }}\">\n    <section id=\"operator\" style=\"padding: 0 0 clamp(56px, 8vw, 100px); scroll-margin-top: 76px;\">\n      <div style=\"border-top: 1px solid rgba(236,233,226,.25); padding-top: clamp(36px, 5vw, 64px); display: flex; flex-wrap: wrap; align-items: center; gap: clamp(28px, 4vw, 56px);\">\n        <img src=\"926d6517-b1a4-4231-80ac-954f7fa29b26\" alt=\"Portrait of Itsara Kaewruang\" width=\"120\" height=\"120\" style=\"width: clamp(92px, 11vw, 120px); height: clamp(92px, 11vw, 120px); border-radius: 50%; object-fit: cover; object-position: 50% 24%; border: 1px solid rgba(236,233,226,.35); flex: none; filter: grayscale(1) contrast(1.05);\">\n        <div style=\"flex: 1 1 380px; min-width: 0;\">\n          <h2 style=\"margin: 0; font-size: clamp(22px, 2.8vw, 34px); font-weight: 600; letter-spacing: -0.02em; text-wrap: balance;\">Built by the person whose money is in it<span style=\"color: #ff431a;\">.<\u002Fspan><\u002Fh2>\n          <p style=\"margin: 14px 0 0; max-width: 58ch; font-size: 15px; line-height: 1.6; color: rgba(236,233,226,.72);\">xAuby was built by one engineer to trade his own capital — every risk limit exists because he pays for its absence. That alignment is the product: a system designed to be trusted by its harshest user first, before it is offered to anyone else.<\u002Fp>\n          <p style=\"margin: 16px 0 0; font-size: 13px; font-weight: 600; color: rgba(236,233,226,.55);\">Itsara Kaewruang <span aria-hidden=\"true\" style=\"color: #ff431a;\">·<\u002Fspan> Founder / Operator<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n    <\u002Fsc-if>\n\n  <\u002Fmain>\n\n  <!-- ===== Footer ===== -->\n  <footer style=\"border-top: 1px solid rgba(236,233,226,.25); background: #101010;\">\n    <div style=\"max-width: 1160px; margin: 0 auto; padding: clamp(32px, 5vw, 52px) clamp(20px, 5vw, 48px) calc(clamp(32px, 5vw, 52px) + env(safe-area-inset-bottom)); display: flex; flex-wrap: wrap; align-items: flex-start; justify-content: space-between; gap: 28px;\">\n      <div style=\"flex: 1 1 320px; min-width: 0;\">\n        <p style=\"margin: 0; display: flex; align-items: center; gap: 8px; font-size: 17px; font-weight: 700;\"><span aria-hidden=\"true\" style=\"width: 9px; height: 9px; border-radius: 50%; background: #ff431a;\"><\u002Fspan>xAuby<\u002Fp>\n        <p style=\"margin: 8px 0 0; font-size: 11.5px; font-weight: 500; letter-spacing: .06em; text-transform: uppercase; color: rgba(236,233,226,.55);\">Gold Trading Research Platform<\u002Fp>\n        <p style=\"margin: 18px 0 0; max-width: 60ch; font-size: 12px; line-height: 1.6; color: rgba(236,233,226,.5);\">For education and research. Trading involves substantial risk; past performance does not guarantee future results. Simulation first — live only after risk limits, alerts, and replay validation are checked.<\u002Fp>\n      <\u002Fdiv>\n      <nav aria-label=\"Footer\" style=\"display: grid; gap: 2px;\">\n        <sc-for list=\"{{ navLinks }}\" as=\"link\" hint-placeholder-count=\"6\">\n          <a href=\"{{ link.href }}\" style=\"display: inline-flex; align-items: center; min-height: 40px; font-size: 13px; font-weight: 500; color: rgba(236,233,226,.72);\" style-hover=\"color: #ff6a3c;\">{{ link.label }}<\u002Fa>\n        <\u002Fsc-for>\n        <a href=\"https://github.com/iisara555/xAuby\" style=\"display: inline-flex; align-items: center; min-height: 40px; font-size: 13px; font-weight: 500; color: #ff7a4d;\" style-hover=\"color: #ff6a3c;\">GitHub — iisara555/xAuby<\u002Fa>\n      <\u002Fnav>\n    <\u002Fdiv>\n  <\u002Ffooter>\n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;status&quot;: {&quot;editor&quot;: &quot;enum&quot;, &quot;options&quot;: [&quot;LIVE&quot;, &quot;SIM&quot;], &quot;default&quot;: &quot;LIVE&quot;, &quot;tsType&quot;: &quot;\\&quot;LIVE\\&quot; | \\&quot;SIM\\&quot;&quot;, &quot;section&quot;: &quot;State&quot;}, &quot;showRegimeMap&quot;: {&quot;editor&quot;: &quot;boolean&quot;, &quot;default&quot;: true, &quot;tsType&quot;: &quot;boolean&quot;, &quot;section&quot;: &quot;Sections&quot;}, &quot;showOperator&quot;: {&quot;editor&quot;: &quot;boolean&quot;, &quot;default&quot;: true, &quot;tsType&quot;: &quot;boolean&quot;, &quot;section&quot;: &quot;Sections&quot;}}\">\nclass Component extends DCLogic {\n  state = { btc: 20, equity: 10000, regime: 0 };\n\n  componentDidMount() {\n    const reduce = window.matchMedia && window.matchMedia(\"(prefers-reduced-motion: reduce)\").matches;\n    const items = document.querySelectorAll(\"#system .xn-reveal, #research .xn-reveal\");\n    if (reduce) {\n      items.forEach((el) => { el.style.opacity = \"1\"; el.style.transform = \"none\"; });\n      return;\n    }\n    this._io = new IntersectionObserver(\n      (entries) => {\n        entries.forEach((entry) => {\n          if (entry.isIntersecting) {\n            const i = [...items].indexOf(entry.target);\n            entry.target.style.transitionDelay = Math.min(i * 70, 280) + \"ms\";\n            entry.target.style.opacity = \"1\";\n            entry.target.style.transform = \"none\";\n            this._io.unobserve(entry.target);\n          }\n        });\n      },\n      { threshold: 0.2, rootMargin: \"0px 0px -8% 0px\" }\n    );\n    items.forEach((el) => this._io.observe(el));\n\n    // Count-up on the headline backtest figure.\n    const big = document.getElementById(\"bt-big\");\n    if (big && !reduce) {\n      this._io2 = new IntersectionObserver((entries) => {\n        entries.forEach((entry) => {\n          if (!entry.isIntersecting) return;\n          this._io2.disconnect();\n          const t0 = performance.now();\n          const dur = 1400;\n          const tick = (now) => {\n            const t = Math.min((now - t0) / dur, 1);\n            const eased = 1 - Math.pow(1 - t, 3);\n            big.textContent = \"+\" + (92.81 * eased).toFixed(2) + \"%\";\n            if (t < 1) requestAnimationFrame(tick);\n          };\n          requestAnimationFrame(tick);\n        });\n      }, { threshold: 0.6 });\n      this._io2.observe(big);\n    }\n  }\n\n  componentWillUnmount() {\n    if (this._io) this._io.disconnect();\n    if (this._io2) this._io2.disconnect();\n  }\n\n  frontierAt(btc) {\n    // Measured points from report R3 (XAU/BTC efficient frontier), linear between.\n    const pts = [\n      { b: 0, cagr: 11.41, dd: 17.2, sharpe: 0.95 },\n      { b: 20, cagr: 10.5, dd: 13.2, sharpe: 1.08 },\n      { b: 30, cagr: 10.04, dd: 11.3, sharpe: 1.16 },\n      { b: 40, cagr: 9.56, dd: 9.6, sharpe: 1.23 },\n      { b: 50, cagr: 9.08, dd: 8.4, sharpe: 1.31 },\n      { b: 65, cagr: 8.33, dd: 7.0, sharpe: 1.37 },\n      { b: 100, cagr: 6.48, dd: 6.9, sharpe: 1.05 },\n    ];\n    let lo = pts[0], hi = pts[pts.length - 1];\n    for (let i = 0; i < pts.length - 1; i++) {\n      if (btc >= pts[i].b && btc <= pts[i + 1].b) { lo = pts[i]; hi = pts[i + 1]; break; }\n    }\n    const t = hi.b === lo.b ? 0 : (btc - lo.b) / (hi.b - lo.b);\n    const mix = (a, b) => a + (b - a) * t;\n    return { cagr: mix(lo.cagr, hi.cagr), dd: mix(lo.dd, hi.dd), sharpe: mix(lo.sharpe, hi.sharpe) };\n  }\n\n  renderVals() {\n    const status = this.props.status ?? \"LIVE\";\n    const live = status === \"LIVE\";\n    const orange = \"#ff6a3c\";\n    const blue = \"#8a877f\";\n    const ink = \"#ece9e2\";\n\n    return {\n      statusLabel: status,\n      statusDot: live ? \"#ff431a\" : \"#c79a2a\",\n      statusBg: \"transparent\",\n\n      ...(() => {\n        const btc = this.state.btc;\n        const f = this.frontierAt(btc);\n        let zoneLabel, zoneColor, zoneNote;\n        if (btc <= 20) {\n          zoneLabel = \"Growth zone\";\n          zoneColor = \"#ff6a3c\";\n          zoneNote = \"0–20% BTC: highest compounding, deepest drawdowns. The report's note: the first 20% of BTC buys the cheapest risk reduction — DD falls 23% for under 1pp of CAGR.\";\n        } else if (btc <= 50) {\n          zoneLabel = \"Balance zone\";\n          zoneColor = \"#ece9e2\";\n          zoneNote = \"25–50% BTC: the \\u201cno regrets\\u201d middle — drawdown falls fast while returns give way slowly.\";\n        } else if (btc <= 65) {\n          zoneLabel = \"Calm zone · max Sharpe\";\n          zoneColor = \"#ece9e2\";\n          zoneNote = \"55–65% BTC: highest return-per-risk (Sharpe peaks at 1.37 at 65%). For sleeping well, not growing fast.\";\n        } else {\n          zoneLabel = \"Past the point\";\n          zoneColor = \"#8a877f\";\n          zoneNote = \"Beyond 65% BTC the curve bends back: drawdown stops improving while return keeps falling — the report marks this range as not worth it.\";\n        }\n        return {\n          btcPct: btc,\n          btcPctText: btc + \"%\",\n          xauPctText: (100 - btc) + \"%\",\n          dialValueText: (100 - btc) + \"% gold, \" + btc + \"% BTC\",\n          dialCagr: f.cagr.toFixed(2) + \"%\",\n          dialDd: f.dd.toFixed(1) + \"%\",\n          dialSharpe: f.sharpe.toFixed(2),\n          zoneLabel, zoneColor, zoneNote,\n          onBtc: (e) => this.setState({ btc: Number(e.target.value) }),\n        };\n      })(),\n\n      showRegimeMapVal: this.props.showRegimeMap ?? true,\n      showOperatorVal: this.props.showOperator ?? true,\n\n      navLinks: [\n        { href: \"#system\", label: \"System\" },\n        { href: \"#architecture\", label: \"Architecture\" },\n        { href: \"#risk\", label: \"Risk\" },\n        { href: \"#backtest\", label: \"Backtest\" },\n        { href: \"#research\", label: \"Research\" },\n        { href: \"#dashboard\", label: \"Dashboard\" },\n        { href: \"#start\", label: \"Start\" },\n        { href: \"#operator\", label: \"Operator\" },\n      ],\n\n      startSteps: [\n        { num: \"01\", title: \"Clone\", body: \"Grab the repo from GitHub and install with Python. Everything runs on your own machine — no account, no service, no one else's servers.\" },\n        { num: \"02\", title: \"Configure\", body: \"Add your exchange API keys to a local .env and pick a pair in the config. A guided wizard tests the connection before anything runs.\" },\n        { num: \"03\", title: \"Simulate\", body: \"Run in simulation mode against live prices — real signals, fake money. Watch it for weeks, not hours, before you trust it.\" },\n        { num: \"04\", title: \"Go live, small\", body: \"Switch one pair to live with capital you can afford to study with. Risk limits are already on; stops sit on the exchange from the first trade.\" },\n      ],\n\n      reports: [\n        {\n          num: \"R1\",\n          numColor: orange,\n          title: \"Config search — win rate & profit factor\",\n          date: \"Jul 2026\",\n          summary: \"~200 configurations tested with an institutional protocol: 70/30 in-sample/out-of-sample split plus 5-fold walk-forward. The most robust config changes just three values from live — long-only, D1 regime filter, wider fresh-zone window — and is the only leader profitable in both the 2021–23 sideways years and the 2024–26 bull run. (Under this stricter protocol the live config scores PF 1.64 — its headline 1.78 comes from the full-period deep dive.)\",\n          stats: [\n            { value: \"2.06\", label: \"PF (vs 1.64 live)\", color: orange },\n            { value: \"41.3%\", label: \"Win rate\", color: \"#ece9e2\" },\n            { value: \"15%\", label: \"Max DD\", color: \"#ece9e2\" },\n            { value: \"3/5\", label: \"Folds profitable (vs 0/5)\", color: orange },\n          ],\n        },\n        {\n          num: \"R2\",\n          numColor: orange,\n          title: \"Deep dive — the as-deployed config\",\n          date: \"Jul 2026\",\n          summary: \"Trade-by-trade anatomy of all 176 trades: the system loses small and often (median loss under 1%) and pays for it with a right tail of +4% to +12% winners, held 3.9\\u00d7 longer than losers. The slope filter cut max drawdown from 35% to 18.5% while removing only 4 trades.\",\n          stats: [\n            { value: \"+92.8%\", label: \"6-year return\", color: orange },\n            { value: \"+0.40%\", label: \"Expectancy / trade\", color: \"#ece9e2\" },\n            { value: \"12.5 vs 3.2 days\", label: \"Winners vs losers held\", color: \"#ece9e2\" },\n          ],\n        },\n        {\n          num: \"R3\",\n          numColor: \"#8a877f\",\n          title: \"Efficient frontier — gold + BTC portfolio\",\n          date: \"Jul 2026\",\n          summary: \"The two systems' equity curves are uncorrelated (0.015), so blending is real diversification: a 20% BTC sleeve cuts max drawdown 23% while giving up under 1pp of annual return. Recommendation: keep 100% gold live, prove BTC in forward simulation first.\",\n          stats: [\n            { value: \"0.015\", label: \"Correlation\", color: \"#ece9e2\" },\n            { value: \"17.2% → 13.2%\", label: \"Max DD at 80/20\", color: orange },\n            { value: \"1.37\", label: \"Peak Sharpe (35/65)\", color: \"#ece9e2\" },\n          ],\n        },\n        {\n          num: \"R4\",\n          numColor: \"#8a877f\",\n          title: \"Session report — system validation\",\n          date: \"Jul 2026\",\n          summary: \"End-to-end audit of the live system: strategy verification against 150+ documented backtest runs, regime-detector statistical validation (volatility separation \\u03b7\\u00b2 0.041, p<0.001), and live-parity checks between the replay engine and production code.\",\n          stats: [\n            { value: \"150+\", label: \"Documented runs\", color: \"#ece9e2\" },\n            { value: \"p<0.001\", label: \"Regime significance\", color: \"#ece9e2\" },\n          ],\n        },\n      ],\n\n      heroStats: [\n        { value: \"+92.81%\", label: \"Net profit, 6 years\", color: orange },\n        { value: \"36.4%\", label: \"Win rate\", color: ink },\n        { value: \"1.78\", label: \"Profit factor\", color: ink },\n        { value: \"18.52%\", label: \"Max drawdown\", color: blue },\n      ],\n\n      steps: [\n        { num: \"01\", numColor: orange, title: \"Ingest\", body: \"Live gold prices stream in continuously, over two independent channels.\" },\n        { num: \"02\", numColor: orange, title: \"Resolve\", body: \"The system looks up its own rules: which strategy, which timeframe, how much capital it is allowed to use.\" },\n        { num: \"03\", numColor: blue, title: \"Run\", body: \"The strategy reads the market and decides — buy, sell, or do nothing. Most of the time: nothing.\" },\n        { num: \"04\", numColor: blue, title: \"Route\", body: \"A regime detector classifies market conditions and can block trading entirely when they turn hostile.\" },\n        { num: \"05\", numColor: orange, title: \"Execute\", body: \"Orders go to the exchange with a stop-loss attached before entry — protection lives on the exchange, not in the bot's memory.\" },\n        { num: \"06\", numColor: orange, title: \"Persist\", body: \"Every trade and data point is recorded permanently — any decision can be replayed and audited later.\" },\n        { num: \"07\", numColor: blue, title: \"Operate\", body: \"The owner monitors from a terminal, a phone dashboard, and Telegram alerts. He watches; the system trades.\" },\n      ],\n\n      archPillars: [\n        {\n          title: \"Strategy plugins\",\n          body: \"14 strategies ship in the repo. Each is a self-contained plugin — a new strategy is a new file, never a change to the engine that holds the money.\",\n          tag: \"LIVE: cdc_action_zone\",\n          tagInk: \"#161614\",\n          tagBg: \"#ece9e2\",\n          tagBorder: \"#ece9e2\",\n        },\n        {\n          title: \"Multi-pair\",\n          body: \"Each market runs in full isolation — its own strategy, state, and budget — so one pair's failure can never touch another's capital.\",\n          tag: \"RUNNING: 1 pair\",\n          tagInk: \"rgba(236,233,226,.72)\",\n          tagBg: \"transparent\",\n          tagBorder: \"rgba(236,233,226,.3)\",\n        },\n        {\n          title: \"Multi-exchange\",\n          body: \"The exchange is an adapter, not a dependency — switching venues is a configuration change with a built-in connection test, not a migration.\",\n          tag: \"RUNNING: OKX only\",\n          tagInk: \"rgba(236,233,226,.72)\",\n          tagBg: \"transparent\",\n          tagBorder: \"rgba(236,233,226,.3)\",\n        },\n      ],\n\n      riskStats: [\n        { value: \"2%\", label: \"Risk per trade\" },\n        { value: \"25%\", label: \"Max allocation\" },\n        { value: \"6%\", label: \"Daily loss cap\" },\n        { value: \"1\", label: \"Open position, max\" },\n        { value: \"1\\u00d7\", label: \"Max leverage\" },\n        { value: \"50%\", label: \"Partial TP at +12%\" },\n      ],\n\n      backtestStats: [\n        { value: \"36.4%\", label: \"Win rate\" },\n        { value: \"1.78\", label: \"Profit factor\" },\n        { value: \"3.12\\u00d7\", label: \"Payoff ratio\" },\n        { value: \"18.52%\", label: \"Max drawdown\" },\n      ],\n\n      yearlyReturns: (() => {\n        const rows = [\n          { year: \"2020\", value: -3.2 },\n          { year: \"2021\", value: -1.5 },\n          { year: \"2022\", value: -9.2 },\n          { year: \"2023\", value: 14.6 },\n          { year: \"2024\", value: 22.9 },\n          { year: \"2025\", value: 46.9 },\n          { year: \"2026\", value: 7.6 },\n        ];\n        const max = Math.max(...rows.map((r) => Math.abs(r.value)));\n        return rows.map((r) => {\n          const half = (Math.abs(r.value) / max) * 50;\n          return {\n            year: r.year,\n            value: (r.value > 0 ? \"+\" : \"\") + r.value.toFixed(1) + \"%\",\n            barLeft: r.value >= 0 ? 50 : 50 - half,\n            barWidth: half,\n            barColor: r.value >= 0 ? \"#ff431a\" : \"#8a877f\",\n            textColor: r.value >= 0 ? orange : blue,\n          };\n        });\n      })(),\n\n      ...(() => {\n        // Gate arithmetic (Risk section)\n        const eq = this.state.equity;\n        const usd = (n) => n.toLocaleString(\"en-US\", { maximumFractionDigits: 0 });\n        const gateRows = [\n          { value: usd(eq * 0.02) + \" USDT\", label: \"Max risk per trade (2%)\", color: \"#ff6a3c\" },\n          { value: usd(eq * 0.25) + \" USDT\", label: \"Max allocation (25%)\", color: \"#ece9e2\" },\n          { value: usd(eq * 0.06) + \" USDT\", label: \"Daily loss cap (6%)\", color: \"#ece9e2\" },\n        ];\n\n        // Regime router (Regime section)\n        const regimes = [\n          { label: \"Bull trend\", strategy: \"cdc_action_zone\", trade: true, note: \"Trend regime — the router hands the pair to the trend follower. Entries allowed when the entry gates pass.\" },\n          { label: \"Breakout\", strategy: \"cdc_action_zone\", trade: true, note: \"Momentum regime — same trend engine, which historically earns most of its profit in exactly these conditions.\" },\n          { label: \"Low-vol range\", strategy: \"bbrsi_mean_reversion\", trade: true, note: \"Quiet sideways market — routed to mean reversion, which sells the edges of the range instead of chasing direction.\" },\n          { label: \"Vol expansion\", strategy: \"supertrend_ema200\", trade: true, note: \"Volatility is waking up — routed to a breakout-tolerant strategy with a wide trend filter.\" },\n          { label: \"Weak bear\", strategy: \"cdc_action_zone\", trade: true, note: \"Mild downtrend — the trend engine may hold or take short-side signals within its rules.\" },\n          { label: \"Panic sell\", strategy: \"NO_TRADE\", trade: false, note: \"Cascading sell-off — entries blocked entirely. Existing stops stay on the exchange; trailing tightens.\" },\n          { label: \"Bear breakdown\", strategy: \"NO_TRADE\", trade: false, note: \"Support failing with momentum — the router refuses new positions. After six NO_TRADE candles an open position can be force-closed.\" },\n          { label: \"Strong bear\", strategy: \"NO_TRADE\", trade: false, note: \"Established downtrend — standing aside. Capital preserved beats capital deployed.\" },\n        ];\n        const sel = regimes[this.state.regime];\n        const regimeKeys = regimes.map((r, i) => ({\n          label: r.label,\n          pressed: i === this.state.regime,\n          border: i === this.state.regime ? \"#ff431a\" : \"rgba(236,233,226,.25)\",\n          bg: i === this.state.regime ? \"rgba(255,67,26,.12)\" : \"transparent\",\n          ink: i === this.state.regime ? \"#ece9e2\" : \"rgba(236,233,226,.65)\",\n          select: () => this.setState({ regime: i }),\n        }));\n\n        return {\n          equityVal: eq,\n          equityText: usd(eq),\n          onEquity: (e) => this.setState({ equity: Number(e.target.value) }),\n          gateRows,\n          regimeKeys,\n          routerLed: sel.trade ? \"#ff431a\" : \"#8a877f\",\n          routerColor: sel.trade ? \"#ff6a3c\" : \"#8a877f\",\n          routerDecision: sel.trade ? \"TRADES\" : \"STANDS ASIDE\",\n          routerStrategy: sel.strategy,\n          routerNote: sel.note,\n        };\n      })(),\n\n      views: [\n        { name: \"Home\", question: \"Am I OK? Equity, position, and system health at a glance.\", color: orange },\n        { name: \"Signal\", question: \"What the strategy is seeing right now, and why.\", color: blue },\n        { name: \"Ops\", question: \"How the open position is protected — stops, sizing, execution.\", color: orange },\n        { name: \"Regime\", question: \"What kind of market this is, and whether trading is allowed.\", color: blue },\n        { name: \"Activity\", question: \"Every trade and event, in order — what happened while you slept.\", color: orange },\n      ],\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
